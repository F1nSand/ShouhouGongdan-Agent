app:
  ai:
    provider: deepseek
  model:
    http:
      connect-timeout: ${MODEL_CONNECT_TIMEOUT:3s}
      read-timeout: ${MODEL_READ_TIMEOUT:30s}
  embedding:
    model: ${SILICONFLOW_EMBEDDING_MODEL:Qwen/Qwen3-Embedding-0.6B}
  model-request-budget:
    enabled: ${MODEL_REQUEST_BUDGET_ENABLED:true}
    max-attempts: ${MODEL_REQUEST_BUDGET_MAX_ATTEMPTS:50}
    mode: ${MODEL_REQUEST_BUDGET_MODE:lifetime}
    daily-time-zone: ${MODEL_REQUEST_BUDGET_DAILY_TIME_ZONE:Asia/Shanghai}
spring:
  ai:
    retry:
      max-attempts: 1
    dashscope:
      enabled: false
    model:
      chat: openai
      embedding: openai
    openai:
      chat:
        api-key: ${DEEPSEEK_API_KEY}
        base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
        options:
          model: ${DEEPSEEK_CHAT_MODEL:deepseek-flash}
          max-tokens: 512
          response-format:
            type: json_object
          extra-body:
            thinking:
              type: disabled
      embedding:
        api-key: ${SILICONFLOW_API_KEY}
        base-url: ${SILICONFLOW_BASE_URL:https://api.siliconflow.cn}
        options:
          model: ${SILICONFLOW_EMBEDDING_MODEL:Qwen/Qwen3-Embedding-0.6B}
          dimensions: ${EMBEDDING_DIMENSIONS:1024}
