spring:
  ai:
    dashscope:
      enabled: false
    model:
      chat: none
      embedding: none
app:
  ai:
    provider: mock
  security:
    # Development/test-only fallback. Compose supplies a generated JWT_SECRET.
    jwt-secret: ${JWT_SECRET:bG9jYWwtZGVtby1vbmx5LW5vdC1mb3ItcHJvZHVjdGlvbg==}
  demo-seed:
    enabled: ${DEMO_SEED_ENABLED:false}
  knowledge:
    worker-enabled: true
    # The deterministic character n-gram provider scores much lower than a semantic embedding.
    # This threshold is for mock workflow checks only; live profiles keep their production threshold.
    minimum-similarity: 0.08
